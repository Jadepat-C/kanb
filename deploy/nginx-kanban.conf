# VPS: /opt/nginx/conf.d/kanban.conf   (replace kanban.example.com with the real host name)
# Same layout as the other vhosts, minus the /storage/ location: there is no public object store.

server {
    listen 80;
    server_name kanban.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kanban.example.com;

    ssl_certificate /etc/letsencrypt/live/kanban.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanban.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Keep in sync with MAX_UPLOAD_MB (+ a little multipart overhead)
    client_max_body_size 51M;

    # Brute-force protection on the login endpoint (zone defined in 00-rate-limits.conf)
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://100.64.12.34:3040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Uploads: stream straight through instead of buffering on the 442 MB VPS
    location ~ ^/api/cards/[^/]+/attachments$ {
        proxy_pass http://100.64.12.34:3040;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Realtime board updates (WebSocket)
    location ~ ^/api/boards/[^/]+/ws$ {
        proxy_pass http://100.64.12.34:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;
    }

    location / {
        limit_req zone=general_limit burst=40 nodelay;
        proxy_pass http://100.64.12.34:3040;
        proxy_http_version 1.1;
        proxy_buffering off;   # stream file downloads instead of spooling them on the VPS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
