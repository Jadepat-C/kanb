# Development dependencies only (the app runs on the host with `cargo run` / `npm run dev`).
name: kanban-dev
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports: ["127.0.0.1:55432:5432"]
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 3s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:4.52
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64 -volume.max=0
    ports: ["127.0.0.1:58333:8333"]
    volumes:
      - s3:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro,z
volumes:
  db:
  s3:
