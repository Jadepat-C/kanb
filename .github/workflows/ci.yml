# Tests on every push and pull request: unit tests and the frontend build (no database needed), then the permission
# tests (tests/authz.py) against a real server with Postgres and S3 storage.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test --locked
      - name: Every API route is in docs/api.md
        run: python3 ../tests/api_docs.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build

  permissions:
    name: permission tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Start Postgres, SeaweedFS and Mailpit
        run: docker compose -f dev/compose.yaml up -d --wait
      - name: Build and start the server
        working-directory: backend
        run: |
          cargo build --locked
          set -a; . ./.env.example; set +a
          KANBAN_ADMIN_PASSWORD=ci-admin-password ./target/debug/kanban create-admin --username ci_admin
          # never send real email or webhooks from CI
          ALLOW_SIGNUP=true MAIL_REDIRECT=127.0.0.1:51025 WEBHOOK_REDIRECT=http://127.0.0.1:9 ./target/debug/kanban > server.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS localhost:8080/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Every endpoint, as every kind of user
        env:
          KANB_URL: http://localhost:8080
          ADMIN_USER: ci_admin
          ADMIN_PASSWORD: ci-admin-password
        run: python3 tests/authz.py
      - name: Server log
        if: failure()
        run: cat backend/server.log


  upgrade:
    name: upgrade from ${{ matrix.from }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # the first release, and the newest one (whatever it is when this runs)
        from: [first, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Released migrations are never edited
        # a migration that changed after release makes existing servers refuse to start
        # ("migration N was previously applied but has been modified"): add a new one instead
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
          changed=$(git diff --name-only --diff-filter=MDR "$prev" HEAD -- backend/migrations)
          if [ -n "$changed" ]; then echo "migrations changed since $prev:"; echo "$changed"; exit 1; fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo build --locked
        working-directory: backend
      - name: Old release → this build, same data
        run: |
          if [ "${{ matrix.from }}" = first ]; then from=0.1.0; else from=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ | sed 's/^v//'); fi
          dev/upgrade-test.sh "$from"
