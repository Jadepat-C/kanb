# Example nginx site for Kanb (e.g. /etc/nginx/conf.d/kanb.conf). Replace kanb.example.com, point the
# certificate paths at yours (certbot / Let's Encrypt), and keep proxy_pass in line with KANB_BIND.

# Slow down password guessing on sign-in, 2FA, forgot-password and reset.
limit_req_zone $binary_remote_addr zone=kanb_login:10m rate=10r/m;

server {
    listen 80;
    server_name kanb.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kanb.example.com;

    ssl_certificate /etc/letsencrypt/live/kanb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanb.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Keep a little above MAX_UPLOAD_MB.
    client_max_body_size 51M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/auth/(login|login/code|forgot|reset)$ {
        limit_req zone=kanb_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # Uploads stream through instead of being buffered by nginx first.
    location ~ ^/api/cards/[^/]+/attachments$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_request_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Live board updates and the notification bell use WebSockets.
    location ~ ^/api/(boards/[^/]+/ws|notifications/ws)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;   # stream file downloads
    }
}
